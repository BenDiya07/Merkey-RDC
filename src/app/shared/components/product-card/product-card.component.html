<article class="product-card">
  <div class="product-media">
    <a routerLink="/produits/{{ product().id }}" class="product-media-link">
      <img [src]="product().image" [alt]="product().name" class="product-image" loading="lazy">
      <img
        *ngIf="product().personImage"
        [src]="product().personImage"
        [alt]="product().name + ' en porté'"
        class="product-image product-image--hover"
        loading="lazy"
      >
    </a>

    <div class="product-badges">
      <span class="product-badge product-badge--discount" *ngIf="product().discount">-{{ product().discount }}%</span>
      <span class="product-badge product-badge--new" *ngIf="product().isNew && !product().discount">Nouveau</span>
    </div>

    <button
      class="wishlist-btn"
      (click)="toggleFavorite()"
      [class.wishlist-btn--on]="isFavorite()"
      [attr.aria-label]="isFavorite() ? 'Retirer des favoris' : 'Ajouter aux favoris'"
      aria-pressed="false"
    >
      <i class="pi" [ngClass]="isFavorite() ? 'pi-heart-fill' : 'pi-heart'"></i>
    </button>
  </div>

  <div class="product-body">
    <span class="product-category">{{ categoryLabel }}</span>
    <h3 class="product-name">
      <a routerLink="/produits/{{ product().id }}">{{ product().name }}</a>
    </h3>

    <div class="product-rating">
      <span class="stars">
        <i
          class="pi pi-star-fill"
          *ngFor="let s of stars"
          [class.star-off]="s >= product().rating"
        ></i>
      </span>
      <span class="rating-text">{{ product().rating.toFixed(1) }} ({{ product().reviewsCount }})</span>
    </div>

    <p class="product-description">{{ product().description }}</p>

    <div class="product-footer">
      <div class="product-price">
        <span class="price-now">{{ formattedPrice }}</span>
        <span class="price-old" *ngIf="formattedOldPrice">{{ formattedOldPrice }}</span>
      </div>
      <span class="product-sold">{{ product().sold }} vendus</span>
    </div>

    <div class="product-actions">
      <button class="btn btn-primary btn-sm product-add" (click)="addToCart()" [disabled]="product().stock === 0">
        <i class="pi pi-shopping-cart"></i>
        {{ product().stock === 0 ? 'Rupture' : 'Ajouter' }}
      </button>
      <a routerLink="/produits/{{ product().id }}" class="btn btn-outline btn-sm">Voir</a>
    </div>
  </div>
</article>
